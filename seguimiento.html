
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Alumnos</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Escudo Colegio" class="logo-img">
                <span>Sistema Previas</span>
            </a>

            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="alumno.html">Alta Alumnos</a></li>
                <li><a href="docente.html">Alta Docentes</a></li>
                <li><a href="seguimiento.html" class="active">Seguimiento</a></li>
                <li><a href="reportes.html">Reportes</a></li>
            </ul>
        </div>
    </nav>

    <div class="card">
        <h2>Carga de Seguimiento</h2>
        <p class="subtitulo">Registro de evolución académica</p>

        <form id="seguimientoForm">
            <label for="dni_alumno">DNI del Alumno:</label>
            <input type="text" id="dni_alumno" name="dni_alumno" placeholder="Ej: 45477037" required>

            <label for="dni_docente">DNI del Docente:</label>
            <input type="text" id="dni_docente" name="dni_docente" placeholder="Ej: 30123456" required>

            <label for="fecha_encuentro">Fecha Encuentro:</label>
            <input type="date" id="fecha_encuentro" name="fecha_encuentro" required>

            <label for="avance_comentarios">Avance / Comentarios:</label>
            <input type="text" id="avance_comentarios" name="avance_comentarios" placeholder="Ej: Presentó TP1 incompleto" required>

            <label for="nota">Nota / Calificación:</label>
            <input type="text" id="nota" name="nota" placeholder="Ej: 7 / Aprobado">

            <label for="fecha_proximo_encuentro">Próximo Encuentro:</label>
            <input type="date" id="fecha_proximo_encuentro" name="fecha_proximo_encuentro">

            <button type="submit">Guardar Seguimiento</button>

            <!-- Mensajes de respuesta -->
            <p id="mensajeExito" style="display:none; color: green; font-weight: bold; margin-top: 10px;"></p>
            <p id="mensajeError" style="display:none; color: red; font-weight: bold; margin-top: 10px;"></p>
        </form>
    </div>

    <!-- Librería cliente de Supabase y Script local -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="seguimiento.js"></script>

</body>

</html>
