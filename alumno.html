<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción de Alumno</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Escudo Colegio" class="logo-img">
                <span>Sistema Previas</span>
            </a>

            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="alumno.html" class="active">Alta Alumnos</a></li>
                <li><a href="docente.html">Alta Docentes</a></li>
                <li><a href="seguimiento.html">Seguimiento</a></li>
                <li><a href="reportes.html">Reportes</a></li>
            </ul>
        </div>
    </nav>

    <div class="card">
        <h2>Registro de Alumno</h2>
        <p class="subtitulo">Datos del estudiante</p>

        <form id="alumnoForm">
            <label for="dni_alumno">DNI del Alumno:</label>
            <input type="text" id="dni_alumno" name="dni_alumno" placeholder="Ej: 45477037" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ej: Maffioli" required>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Pablo" required>

            <label for="correo_electronico">Correo Electrónico:</label>
            <input type="email" id="correo_electronico" name="correo_electronico" placeholder="pablo@bue.edu.ar" required>

            <button type="submit">Guardar Alumno</button>

            <!-- Mensajes de respuesta -->
            <p id="mensajeExito" style="display:none; color: green; font-weight: bold; margin-top: 10px;"></p>
            <p id="mensajeError" style="display:none; color: red; font-weight: bold; margin-top: 10px;"></p>
        </form>
    </div>

    <!-- Librería cliente de Supabase y Script local -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="alumno.js"></script>

</body>

</html>
